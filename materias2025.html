<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materias 2025</title>
  <link rel="stylesheet" href="css/style.css" />
  <link id="tema-oscuro" rel="stylesheet" href="" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    .materias-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }

    .materia-card {
      background-color: #e9f2f9;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }

    .materia-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .materia-card a {
      text-decoration: none;
      color: #2a5c82;
      font-weight: bold;
    }

    .materia-card a:hover {
      text-decoration: underline;
    }

    body.dark-mode .materia-card {
      background-color: #1f1f1f;
      border: 1px solid #444;
    }

    body.dark-mode .materia-card a {
      color: #a8d0ff;
    }
  </style>
</head>
<body>
  <button class="dark-button" id="modoOscuroBtn">Modo Oscuro</button>

  <header>
    <h1>Materias 2025</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="avisos.html">Avisos</a></li>
        <li><a href="sobremi.html">Sobre Mí</a></li>
        <li><a href="materias2025.html" class="active">Materias 2025</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2 class="seccion-titulo">Mis Materias este Cuatrimestre</h2>

    <section class="materias-grid">
      <div class="materia-card">
        <a href="materias/analisis-matematico.html">Análisis Matemático</a>
      </div>
      <div class="materia-card">
        <a href="materias/desarrollo-pagina-web.html">Desarrollo de Página Web</a>
      </div>
      <div class="materia-card">
        <a href="materias/sistemas-2.html">Sistemas 2</a>
      </div>
      <div class="materia-card">
        <a href="materias/programacion-2.html">Programación 2</a>
      </div>
    </section>
  </main>

    <footer>
      <div class="footer-contenido">
        <p>© 2025 Nicolás Terradas - Proyecto UADE</p>
        <a href="https://github.com/NTerra21/Proyecto-Pagina-Web-UADE/tree/gh-pages" target="_blank">Repositorio GitHub</a>
      </div>
      <img src="img/UADE.png" alt="Logo UADE" />
    </footer>


  <script>
    const linkOscuro = document.getElementById('tema-oscuro');
    const btn = document.getElementById('modoOscuroBtn');
    const body = document.body;

    if (localStorage.getItem('modoOscuro') === 'true') {
      linkOscuro.href = 'css/oscuro.css';
      body.classList.add('dark-mode');
    }

    btn.addEventListener('click', function () {
      const isDark = linkOscuro.href.includes('oscuro.css');
      linkOscuro.href = isDark ? '' : 'css/oscuro.css';
      body.classList.toggle('dark-mode', !isDark);
      localStorage.setItem('modoOscuro', String(!isDark));
    });
  </script>
</body>
</html>
