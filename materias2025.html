<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materias 2025</title>

  <link rel="stylesheet" href="css/style.css" />
  <link id="tema-oscuro" rel="stylesheet" href="" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .botones-materias {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      justify-items: center;
      margin-top: 2rem;
    }

    .boton-materia {
      display: inline-block;
      background-color: #2a5c82;
      color: white !important;
      padding: 1rem 2rem;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.2s ease;
      min-width: 220px;
    }

    .boton-materia:hover {
      background-color: #1d3e5a;
    }

    .seccion-titulo {
      color: #2a5c82;
      font-size: 1.6rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #2a5c82;
      padding-bottom: 0.5rem;
    }

    body.dark-mode .seccion-titulo {
      color: #90c4ff;
      border-color: #90c4ff;
    }
  </style>
</head>
<body>

  <button class="dark-button" id="modoOscuroBtn">Modo Oscuro</button>

  <header>
    <h1>Materias 2025</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="avisos.html">Avisos</a></li>
        <li><a href="sobremi.html">Sobre Mí</a></li>
        <li><a href="materias2025.html" class="active">Materias 2025</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="contenedor-principal">
    <h2 class="seccion-titulo">Mis Materias este Cuatrimestre</h2>

    <div class="botones-materias">
      <a href="materias/analisis-matematico.html" class="boton-materia">Análisis Matemático</a>
      <a href="materias/desarrollo-pagina-web.html" class="boton-materia">Desarrollo de Página Web</a>
      <a href="materias/sistemas-2.html" class="boton-materia">Sistemas 2</a>
      <a href="materias/programacion-2.html" class="boton-materia">Programación 2</a>
    </div>
  </main>

  <footer>
    <div class="footer-contenido">
      <p>© 2025 Nicolás Terradas - Proyecto UADE</p>
      <a href="https://github.com/NTerra21/Proyecto-Pagina-Web-UADE/tree/gh-pages" target="_blank">Repositorio GitHub</a>
    </div>
    <img src="img/UADE.png" alt="Logo UADE" />
  </footer>

  <script>
    const linkOscuro = document.getElementById('tema-oscuro');
    const btn = document.getElementById('modoOscuroBtn');
    const body = document.body;

    if (localStorage.getItem('modoOscuro') === 'true') {
      linkOscuro.href = 'css/oscuro.css';
      body.classList.add('dark-mode');
    }

    btn.addEventListener('click', function () {
      const isDark = linkOscuro.href.includes('oscuro.css');
      linkOscuro.href = isDark ? '' : 'css/oscuro.css';
      body.classList.toggle('dark-mode', !isDark);
      body.classList.add('modo-transicion');
    
      // Elimina la clase después de 500ms
      setTimeout(() => {
        body.classList.remove('modo-transicion');
      }, 500);
  
      localStorage.setItem('modoOscuro', String(!isDark));
    });
  </script>
</body>
</html>
