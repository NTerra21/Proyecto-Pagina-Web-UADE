<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto</title>

  <link rel="stylesheet" href="css/style.css" />
  <link id="tema-oscuro" rel="stylesheet" href="" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    main {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: #d9e6f2;
      border-radius: 10px;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body.dark-mode main {
      background-color: #1e1e1e;
      color: #f0f0f0;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    input, textarea {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #2a5c82;
    }

    button {
      padding: 0.8rem;
      background-color: #2a5c82;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #1b3e5a;
    }

    .alerta-exito {
      padding: 1rem;
      margin-top: 1rem;
      background-color: #c0ebc0;
      color: #265c26;
      border-radius: 8px;
      display: none;
    }

    body.dark-mode .alerta-exito {
      background-color: #2f4f2f;
      color: #a5f5a5;
    }
  </style>
</head>
<body>

  <button class="dark-button" id="modoOscuroBtn">Modo Oscuro</button>

  <header>
    <h1>Contacto</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="avisos.html">Avisos</a></li>
        <li><a href="sobremi.html">Sobre Mí</a></li>
        <li><a href="materias2025.html">Materias 2025</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Dejame tu consulta</h2>

    <form id="form-contacto" onsubmit="return enviarFormulario(event)">
      <input type="text" name="nombre" placeholder="Tu nombre completo" required />

      <input type="email" name="correo" placeholder="Tu correo (@gmail.com)" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" required />

      <textarea name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>

      <button type="submit">Enviar mensaje</button>
    </form>

    <div class="alerta-exito" id="alerta">
      ✅ ¡Tu mensaje ha sido enviado con éxito!
    </div>
  </main>

  <footer>
    <div class="footer-contenido">
      <p>© 2025 Nicolás Terradas - Proyecto UADE</p>
      <a href="https://github.com/NTerra21/Proyecto-Pagina-Web-UADE/tree/gh-pages" target="_blank">Repositorio GitHub</a>
    </div>
    <img src="img/UADE.png" alt="Logo UADE" />
  </footer>

  <script>
    // Modo oscuro
    const linkOscuro = document.getElementById('tema-oscuro');
    const btn = document.getElementById('modoOscuroBtn');
    const body = document.body;

    if (localStorage.getItem('modoOscuro') === 'true') {
      linkOscuro.href = 'css/oscuro.css';
      body.classList.add('dark-mode');
    }

    btn.addEventListener('click', function () {
      const isDark = linkOscuro.href.includes('oscuro.css');
      linkOscuro.href = isDark ? '' : 'css/oscuro.css';
      body.classList.toggle('dark-mode', !isDark);
      localStorage.setItem('modoOscuro', String(!isDark));
      body.classList.add('modo-transicion');
      setTimeout(() => body.classList.remove('modo-transicion'), 500);
    });

    // Envío del formulario simulado
    function enviarFormulario(event) {
      event.preventDefault();
      const alerta = document.getElementById('alerta');
      alerta.style.display = 'block';
      document.getElementById('form-contacto').reset();
      setTimeout(() => alerta.style.display = 'none', 5000);
      return false;
    }
  </script>
</body>
</html>
